<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Clientes | PEDRO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            /* Paleta de Cores Modern Tech */
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #e0e7ff;
            --secondary: #64748b;

            --bg-app: #f8fafc;
            --bg-surface: #ffffff;

            --text-main: #1e293b;
            --text-muted: #94a3b8;

            --danger: #ef4444;
            --success: #10b981;
            --border: #e2e8f0;

            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);

            --font-family: 'Outfit', sans-serif;
        }

        /* Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* Layout Grid Principal */
        .app-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: -0.5px;
        }

        .nav-menu { display: flex; flex-direction: column; gap: 0.5rem; }
        .nav-item {
            text-decoration: none;
            color: var(--secondary);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s ease;
        }
        .nav-item:hover { background-color: var(--bg-app); color: var(--primary); }
        .nav-item.active { background-color: var(--primary-light); color: var(--primary); }

        /* Conteúdo Principal */
        .main-content {
            overflow-y: auto;
            padding: 2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
        }
        .top-bar h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem; }

        .user-profile .avatar {
            width: 40px; height: 40px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }

        /* Grid de Trabalho */
        .workspace-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            align-items: start;
        }

        /* Cards */
        .card {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .card-header h2 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .badge {
            font-size: 0.75rem;
            background: var(--bg-app);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            color: var(--secondary);
            border: 1px solid var(--border);
        }

        /* Inputs */
        .input-group { margin-bottom: 1.25rem; position: relative; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--secondary); margin-bottom: 0.4rem; font-weight: 500; }

        .input-wrapper { position: relative; }
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-family);
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: var(--bg-surface);
        }

        .modal-box input, .filters-area input { padding-left: 1rem; }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Autocomplete */
        .autocomplete-dropdown {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            z-index: 10;
            list-style: none;
            margin-top: 4px;
            max-height: 200px;
            overflow-y: auto;
        }
        .autocomplete-dropdown li {
            padding: 0.75rem;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 1px solid var(--bg-app);
            color: var(--text-main);
        }
        .autocomplete-dropdown li:hover { background-color: var(--bg-app); color: var(--primary); }

        /* Botões */
        .btn {
            cursor: pointer; border: none; font-family: var(--font-family);
            padding: 0.75rem 1.5rem; border-radius: var(--radius-sm);
            font-weight: 500; font-size: 0.9rem;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            transition: 0.2s;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-dark); }

        .btn-ghost { background: transparent; color: var(--secondary); }
        .btn-ghost:hover { background: var(--bg-app); color: var(--text-main); }

        .btn-outline { background: transparent; border: 1px dashed var(--border); color: var(--primary); }
        .btn-outline:hover { border-color: var(--primary); background: var(--primary-light); }

        .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }

        .btn-icon {
            width: 32px; height: 32px;
            border-radius: 6px; border: none;
            background: transparent;
            cursor: pointer;
            color: var(--secondary);
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
            font-size: 1.1rem;
        }
        .btn-icon:hover { background: var(--bg-app); color: var(--primary); }
        .btn-icon.danger:hover { background: #fee2e2; color: var(--danger); }

        .full-width { width: 100%; }
        .actions { display: flex; gap: 0.5rem; align-items: center; }
        .divider { margin: 1.5rem 0; border: none; border-top: 1px solid var(--border); }

        /* Tabela */
        .table-responsive { width: 100%; overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .data-table th {
            text-align: left; padding: 1rem;
            color: var(--secondary);
            font-weight: 600; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        .data-table td { padding: 1rem; border-bottom: 1px solid var(--border); color: var(--text-main); }

        /* CORREÇÃO DO FUNDO CINZA: Forçar fundo branco nas linhas e borda inferior */
        .data-table tr { background-color: var(--bg-surface); }
        .data-table tr:hover td { background-color: #f8fafc; }

        .text-right { text-align: right; }
        .action-cell { display: flex; gap: 0.25rem; justify-content: flex-end; }

        /* Modais */
        dialog.app-modal {
            margin: auto; padding: 0; border: none; border-radius: var(--radius-md);
            box-shadow: var(--shadow-md); background: transparent;
            max-width: 90vw;
        }
        dialog::backdrop { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); }

        .modal-box { background: white; padding: 2rem; width: 450px; display: flex; flex-direction: column; gap: 1.5rem; }
        .app-modal.large .modal-box { width: 800px; max-height: 90vh; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }

        /* CORREÇÃO VISUAL DO MODAL: Scroll interno para tabelas grandes */
        .modal-body {
            overflow-y: auto;
            max-height: 65vh; /* Limita a altura do conteúdo interno */
            padding-right: 0.5rem;
        }

        .modal-footer { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem; }

        /* Filtros */
        .filters-area { background: var(--bg-app); padding: 1.5rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; border: 1px solid var(--border); }
        .filter-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1rem; }
        .filter-item.full { width: 100%; margin-bottom: 1rem; }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1.5rem; }

        /* Responsividade */
        @media (max-width: 1024px) {
            .app-layout { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .workspace-grid { grid-template-columns: 1fr; gap: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="brand">
            <i class="ph-fill ph-hexagon"></i>
            <span>PEDRO</span>
        </div>
        <nav class="nav-menu">
            <a href="orcamentos" class="nav-item"><i class="ph ph-currency-dollar"></i> Orçamentos</a>
            <a href="usuarios" class="nav-item"><i class="ph ph-users"></i> Usuários</a>
            <a href="clientes" class="nav-item active"><i class="ph ph-address-book"></i> Clientes</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div>
                <h1>Clientes</h1>
                <p class="subtitle">Gerencie sua base de contatos e relatórios.</p>
            </div>
            <div class="user-profile">
                <span class="avatar">PH</span>
            </div>
        </header>

        <div class="workspace-grid">
            <section class="card form-card">
                <div class="card-header">
                    <h2>Novo Registro</h2>
                </div>
                <form id="form-create" novalidate>
                    <input type="hidden" name="id" id="field-id">

                    <div class="input-group">
                        <label for="field-nome">Nome Completo</label>
                        <div class="input-wrapper">
                            <i class="ph ph-user input-icon"></i>
                            <input type="text" id="field-nome" placeholder="Ex: João Silva" autocomplete="off" required>
                            <ul id="autocomplete-list" class="autocomplete-dropdown" hidden></ul>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="field-cpf">CPF</label>
                        <div class="input-wrapper">
                            <i class="ph ph-identification-card input-icon"></i>
                            <input type="text" id="field-cpf" placeholder="000.000.000-00" maxlength="14" required>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="ph ph-check-circle"></i> Salvar
                        </button>
                        <button type="button" id="btn-reset" class="btn btn-ghost">Limpar</button>
                    </div>

                    <hr class="divider">

                    <button type="button" id="btn-open-report" class="btn btn-outline full-width">
                        <i class="ph ph-chart-line-up"></i> Acessar Relatórios Avançados
                    </button>
                </form>
            </section>

            <section class="card list-card">
                <div class="card-header">
                    <h2>Base de Clientes</h2>
                    <span class="badge" id="total-count">0 registros</span>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Documento</th>
                            <th class="text-right">Ações</th>
                        </tr>
                        </thead>
                        <tbody id="table-body">
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>

<dialog id="modal-edit" class="app-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Editar Cliente</h3>
            <button class="btn-icon close-modal" data-target="modal-edit"><i class="ph ph-x"></i></button>
        </div>
        <form id="form-edit">
            <input type="hidden" id="edit-id">
            <div class="input-group">
                <label>Nome</label>
                <input type="text" id="edit-nome" required>
            </div>
            <div class="input-group">
                <label>CPF</label>
                <input type="text" id="edit-cpf" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost close-modal" data-target="modal-edit">Cancelar</button>
                <button type="submit" class="btn btn-primary">Atualizar Dados</button>
            </div>
        </form>
    </div>
</dialog>

<dialog id="modal-report" class="app-modal large">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Central de Relatórios</h3>
            <button class="btn-icon close-modal" data-target="modal-report"><i class="ph ph-x"></i></button>
        </div>

        <div class="modal-body">
            <div class="filters-area">
                <div class="filter-item full">
                    <label>Buscar por Nome</label>
                    <input type="text" id="rep-name" placeholder="Digite para filtrar...">
                </div>
                <div class="filter-row">
                    <div class="filter-item">
                        <label>De (Data)</label>
                        <input type="date" id="rep-start">
                    </div>
                    <div class="filter-item">
                        <label>Até (Data)</label>
                        <input type="date" id="rep-end">
                    </div>
                    <div class="filter-item">
                        <label>Min (R$)</label>
                        <input type="number" id="rep-min" step="0.01">
                    </div>
                    <div class="filter-item">
                        <label>Max (R$)</label>
                        <input type="number" id="rep-max" step="0.01">
                    </div>
                </div>
                <div class="filter-actions">
                    <button id="btn-filter-apply" class="btn btn-primary btn-sm">
                        <i class="ph ph-funnel"></i> Filtrar Resultados
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="data-table report-table">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Data</th>
                        <th>Total</th>
                    </tr>
                    </thead>
                    <tbody id="report-body"></tbody>
                </table>
            </div>

            <div class="pagination">
                <button id="pg-prev" class="btn-icon small" disabled><i class="ph ph-caret-left"></i></button>
                <span id="pg-info" style="font-size: 0.9rem; color: var(--secondary);">Página 1</span>
                <button id="pg-next" class="btn-icon small"><i class="ph ph-caret-right"></i></button>
            </div>
        </div>
    </div>
</dialog>

<script>
    class ClientManager {
        constructor() {
            this.api = {
                base: '/api/clientes',
                report: '/api/clientes/relatorio'
            };

            this.state = {
                clients: [],
                reportPage: 0,
                reportSize: 12, // CORREÇÃO: Alterado de 20 para 12
                reportTotalPages: 0
            };

            this.elements = {
                formCreate: document.getElementById('form-create'),
                formEdit: document.getElementById('form-edit'),
                tableBody: document.getElementById('table-body'),
                totalCount: document.getElementById('total-count'),
                autoList: document.getElementById('autocomplete-list'),
                inputs: {
                    nome: document.getElementById('field-nome'),
                    cpf: document.getElementById('field-cpf')
                },
                modals: {
                    edit: document.getElementById('modal-edit'),
                    report: document.getElementById('modal-report')
                }
            };

            this.init();
        }

        init() {
            this.setupEventListeners();
            this.fetchClients();
        }

        setupEventListeners() {
            ['field-cpf', 'edit-cpf'].forEach(id => {
                document.getElementById(id).addEventListener('input', e => {
                    e.target.value = this.formatCPF(e.target.value);
                });
            });

            this.elements.formCreate.addEventListener('submit', e => this.handleCreate(e));
            document.getElementById('btn-reset').addEventListener('click', () => this.elements.formCreate.reset());
            this.elements.formEdit.addEventListener('submit', e => this.handleUpdate(e));

            let timeout;
            this.elements.inputs.nome.addEventListener('input', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => this.handleAutocomplete(e.target.value), 300);
            });

            document.addEventListener('click', (e) => {
                if (e.target !== this.elements.inputs.nome) {
                    this.elements.autoList.hidden = true;
                }
            });

            this.elements.tableBody.addEventListener('click', e => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const id = btn.dataset.id;
                if (btn.classList.contains('action-edit')) this.openEditModal(id);
                if (btn.classList.contains('action-delete')) this.deleteClient(id);
            });

            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.addEventListener('click', () => {
                    const modalId = btn.dataset.target;
                    document.getElementById(modalId).close();
                });
            });

            document.getElementById('btn-open-report').addEventListener('click', () => {
                this.elements.modals.report.showModal();
                this.loadReport(0);
            });

            document.getElementById('btn-filter-apply').addEventListener('click', () => this.loadReport(0));

            document.getElementById('pg-prev').addEventListener('click', () => {
                if(this.state.reportPage > 0) this.loadReport(this.state.reportPage - 1);
            });

            document.getElementById('pg-next').addEventListener('click', () => {
                if(this.state.reportPage < this.state.reportTotalPages - 1) this.loadReport(this.state.reportPage + 1);
            });
        }

        async fetchClients() {
            try {
                const res = await fetch(this.api.base);
                if(res.ok) {
                    this.state.clients = await res.json();
                    this.renderTable();
                }
            } catch (error) {
                console.error('Demo Mode');
                if(this.state.clients.length === 0) {
                    this.state.clients = [{id: 1, nome: "Demo User", cpf: "12345678901"}];
                    this.renderTable();
                }
            }
        }

        renderTable() {
            this.elements.tableBody.innerHTML = '';
            const displayData = this.state.clients.slice(-10).reverse();
            this.elements.totalCount.textContent = `${this.state.clients.length} registros`;

            displayData.forEach(client => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                        <td><span style="font-family: monospace; color: var(--secondary)">#${client.id}</span></td>
                        <td><strong>${client.nome}</strong></td>
                        <td>${this.formatCPF(client.cpf)}</td>
                        <td class="action-cell">
                            <button class="btn-icon action-edit" data-id="${client.id}"><i class="ph ph-pencil-simple"></i></button>
                            <button class="btn-icon danger action-delete" data-id="${client.id}"><i class="ph ph-trash"></i></button>
                        </td>
                    `;
                this.elements.tableBody.appendChild(tr);
            });
        }

        async handleCreate(e) {
            e.preventDefault();
            const payload = {
                nome: this.elements.inputs.nome.value,
                cpf: this.cleanCPF(this.elements.inputs.cpf.value)
            };
            await this.sendRequest(this.api.base, 'POST', payload);
            this.elements.formCreate.reset();
            this.fetchClients();
        }

        async handleUpdate(e) {
            e.preventDefault();
            const payload = {
                id: document.getElementById('edit-id').value,
                nome: document.getElementById('edit-nome').value,
                cpf: this.cleanCPF(document.getElementById('edit-cpf').value)
            };
            await this.sendRequest(this.api.base, 'POST', payload);
            this.elements.modals.edit.close();
            this.fetchClients();
        }

        async deleteClient(id) {
            if(confirm('Excluir cliente?')) {
                await fetch(`${this.api.base}/${id}`, { method: 'DELETE' });
                this.fetchClients();
            }
        }

        async openEditModal(id) {
            const res = await fetch(`${this.api.base}/${id}`);
            if(res.ok) {
                const client = await res.json();
                document.getElementById('edit-id').value = client.id;
                document.getElementById('edit-nome').value = client.nome;
                document.getElementById('edit-cpf').value = this.formatCPF(client.cpf);
                this.elements.modals.edit.showModal();
            }
        }

        handleAutocomplete(query) {
            this.elements.autoList.innerHTML = '';
            this.elements.autoList.hidden = true;
            if(query.length < 2) return;

            const matches = this.state.clients
                .filter(c => c.nome.toLowerCase().includes(query.toLowerCase()))
                .slice(0, 5);

            if(matches.length > 0) {
                this.elements.autoList.hidden = false;
                matches.forEach(c => {
                    const li = document.createElement('li');
                    li.textContent = c.nome;
                    li.onclick = () => {
                        this.elements.inputs.nome.value = c.nome;
                        this.elements.inputs.cpf.value = this.formatCPF(c.cpf);
                        document.getElementById('field-id').value = c.id;
                        this.elements.autoList.hidden = true;
                    };
                    this.elements.autoList.appendChild(li);
                });
            }
        }

        async loadReport(page) {
            const filters = {
                page: page,
                size: this.state.reportSize,
                nome: document.getElementById('rep-name').value,
                dataInicio: document.getElementById('rep-start').value,
                dataFim: document.getElementById('rep-end').value,
                valorMin: document.getElementById('rep-min').value,
                valorMax: document.getElementById('rep-max').value
            };

            const params = new URLSearchParams();
            Object.entries(filters).forEach(([k, v]) => { if(v) params.append(k, v); });

            try {
                const res = await fetch(`${this.api.report}?${params.toString()}`);
                const data = await res.json();
                this.renderReportTable(data);
            } catch(e) {
                // Mock para visualizar a correção visual sem backend
                const mockData = {
                    content: Array(12).fill(0).map((_, i) => ({
                        nome: `Cliente Teste ${i+1}`,
                        cpf: '00011122233',
                        dataCadastro: '2024-05-15',
                        totalGasto: 1500.00
                    })),
                    totalPages: 5,
                    number: page
                };
                this.renderReportTable(mockData);
            }
        }

        renderReportTable(data) {
            const tbody = document.getElementById('report-body');
            tbody.innerHTML = '';

            this.state.reportPage = data.number || 0;
            this.state.reportTotalPages = data.totalPages || 0;

            document.getElementById('pg-info').textContent = `Página ${this.state.reportPage + 1} de ${this.state.reportTotalPages || 1}`;
            document.getElementById('pg-prev').disabled = this.state.reportPage === 0;
            document.getElementById('pg-next').disabled = this.state.reportPage >= (this.state.reportTotalPages - 1);

            const list = data.content || [];
            if(list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Sem dados.</td></tr>';
                return;
            }

            list.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                        <td>${c.nome}</td>
                        <td>${this.formatCPF(c.cpf)}</td>
                        <td>${new Date(c.dataCadastro).toLocaleDateString('pt-BR')}</td>
                        <td>${new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(c.totalGasto || 0)}</td>
                    `;
                tbody.appendChild(tr);
            });
        }

        async sendRequest(url, method, body) {
            await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        }

        formatCPF(cpf) {
            if(!cpf) return '';
            return cpf.replace(/\D/g, '').substring(0, 11).replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        }

        cleanCPF(cpf) { return cpf.replace(/\D/g, ''); }
    }

    document.addEventListener('DOMContentLoaded', () => new ClientManager());
</script>
</body>
</html>
